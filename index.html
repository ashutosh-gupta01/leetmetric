<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetric</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- // heading 
        // user
        // stats -->
        <h1>LeetMetric</h1>

        <div class="user-container">
            <p>Enter username below:</p>
            <div class="user-input-container">
                <input type="text" placeholder="enter your username here" id="user-input">
                <button id="search-btn">search</button>
            </div>
        </div>
        <div class="stast-container">

            <div class="progress">

                <div class="progress-item">
                    <div class="easy-progress circle">
                        <span id="easy-lable"></span>
                        <p>Easy</p>
                    </div>
                </div>

                <div class="progress-item">
                     <div class="medium-progress circle">
                        <span id="medium-lable"></span>
                        <p>Medium</p>
                    </div>
                </div>

                <div class="progress-item">
                     <div class="hard-progress circle">
                        <span id="hard-lable"></span>
                        <p>Hard</p>
                    </div>
                </div>

            </div>

            <div class="stats-card">
                <!-- directly populated card from js code -->
            </div>

        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
